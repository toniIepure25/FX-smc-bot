services:
  forward-paper:
    build:
      context: .
    container_name: fx-forward-paper
    restart: unless-stopped
    env_file: .env
    environment:
      FEED_MODE: ${FEED_MODE:-live}
      AUTO_RESUME: "true"
    volumes:
      - forward-runs:/app/forward_runs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  daily-report:
    build:
      context: .
    container_name: fx-daily-report
    restart: "no"
    env_file: .env
    volumes:
      - forward-runs:/app/forward_runs:ro
    entrypoint: ["tini", "--", "python", "scripts/generate_report.py", "--type", "daily"]
    profiles:
      - reporting

  weekly-report:
    build:
      context: .
    container_name: fx-weekly-report
    restart: "no"
    env_file: .env
    volumes:
      - forward-runs:/app/forward_runs:ro
    entrypoint: ["tini", "--", "python", "scripts/generate_report.py", "--type", "weekly"]
    profiles:
      - reporting

volumes:
  forward-runs:
    driver: local
