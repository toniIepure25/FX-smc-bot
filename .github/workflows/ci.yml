name: CI

on:
  push:
    branches: [main, master, "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Lint non-research source
        run: python -m ruff check src/fx_smc_bot --exclude src/fx_smc_bot/research

      - name: Lint dashboard, CLI and runner tests
        run: |
          python -m ruff check dashboard/app.py tests/test_cli.py \
            tests/test_data/test_audit.py tests/test_dashboard \
            tests/test_backtesting/test_runner.py

      - name: Validate checkout
        run: python -m fx_smc_bot doctor --config configs/base.yaml --strict

      - name: Run test suite with coverage
        run: |
          python -m pytest -q --no-header \
            --cov=fx_smc_bot --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: Wheel package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling and project extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install the wheel and validate the entry points
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          fx-smc info
          python -m fx_smc_bot doctor --strict

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fx-smc-bot:ci .

      - name: Verify the image runs unprivileged
        run: test "$(docker run --rm fx-smc-bot:ci id -u)" = "10001"

      - name: Verify the CLI inside the image
        run: docker run --rm fx-smc-bot:ci python -m fx_smc_bot info

      - name: Run a synthetic backtest inside the image
        run: |
          docker run --rm fx-smc-bot:ci \
            python -m fx_smc_bot backtest --synthetic --bars 120 --log-level ERROR
