name: CI

on:
  push:
    branches: [main, master, "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Lint non-research source
        run: python -m ruff check src/fx_smc_bot --exclude src/fx_smc_bot/research

      - name: Lint dashboard, CLI and runner tests
        run: python -m ruff check tests/test_cli.py tests/test_dashboard tests/test_backtesting/test_runner.py

      - name: Validate checkout
        run: python -m fx_smc_bot doctor --config configs/base.yaml --strict

      - name: Run test suite with coverage
        run: |
          python -m pytest -q --no-header \
            --cov=fx_smc_bot --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
